<!DOCTYPE html>
<html>
<head>
    <title>Div and Span Example</title>
    <style>
        /* Div styling (block-level) */
        .container {
            width: 80%;
            margin: auto;
            border: 2px solid #333;
            padding: 20px;
        }

        .header {
            background-color: lightblue;
            padding: 15px;
            text-align: center;
        }

        .content {
            background-color: #f4f4f4;
            padding: 15px;
            margin-top: 10px;
        }

        .footer {
            background-color: lightgray;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
        }

        /* Span styling (inline-level) */
        .highlight {
            color: red;
            font-weight: bold;
        }

        .blue-text {
            color: blue;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>My Website</h1>
        </div>

        <div class="content">
            <p>
                This is a <span class="highlight">div and span</span> example.
                The <span class="blue-text">span tag</span> styles inline text.
            </p>
        </div>

        <div class="footer">
            <p>© 2025 Ayush Jaiswal</p>
        </div>

    </div>

</body>
</html>
