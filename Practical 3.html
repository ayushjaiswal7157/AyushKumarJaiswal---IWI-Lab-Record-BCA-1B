<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Layout</title>
</head>
<body>

    <h1>Student Information Table</h1>

    <table border="1" align="center" cellpadding="10" cellspacing="0" width="60%">
        <caption><b>Student Academic Details</b></caption>

        <tr align="center">
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Subjects</th>
        </tr>

        <tr align="center">
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
        </tr>

        <tr align="center">
            <td>101</td>
            <td align="left">Ayush</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
        </tr>

        <tr align="center">
            <td>102</td>
            <td align="left">Rohit</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
        </tr>

        <tr>
            <td colspan="5" align="center">
                <b>Total Students: 2</b>
            </td>
        </tr>

    </table>

</body>
</html>
