<!DOCTYPE html>
<html>
<head>
    <title>Canvas Drawing Example</title>
</head>
<body>

    <h2>HTML Canvas Drawing</h2>

    <canvas id="myCanvas" width="400" height="300" style="border:1px solid #000000;">
        Your browser does not support the canvas element.
    </canvas>

    <script>
        // Get the canvas element and context
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // Draw a filled rectangle
        ctx.fillStyle = "lightblue";
        ctx.fillRect(50, 30, 100, 60); // x, y, width, height

        // Draw a stroked rectangle
        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;
        ctx.strokeRect(200, 30, 100, 60);

        // Draw a circle
        ctx.beginPath();
        ctx.arc(100, 150, 40, 0, 2 * Math.PI); // x, y, radius, startAngle, endAngle
        ctx.fillStyle = "green";
        ctx.fill();
        ctx.stroke();

        // Draw a triangle
        ctx.beginPath();
        ctx.moveTo(250, 150);   // start point
        ctx.lineTo(200, 220);   // second point
        ctx.lineTo(300, 220);   // third point
        ctx.closePath();
        ctx.fillStyle = "orange";
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.stroke();
    </script>

</body>
</html>
